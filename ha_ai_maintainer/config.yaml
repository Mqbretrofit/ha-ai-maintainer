name: HA AI Maintainer
version: "0.5.0"
slug: ha_ai_maintainer
description: Local diagnostics with approval-gated AI and Codex repairs
url: "https://github.com/Mqbretrofit/ha-ai-maintainer/tree/main/ha_ai_maintainer"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-industrial
panel_title: AI karbantartó
panel_admin: true
watchdog: "http://[HOST]:[PORT:8099]/health"
stage: experimental
breaking_versions:
  - "0.4.0"
map:
  - type: homeassistant_config
    read_only: false
options:
  scan_interval_minutes: 15
  max_problem_entities: 50
  max_log_lines: 1000
  redact_sensitive_data: true
  github_token: ""
  entity_cleanup_enabled: false
  entity_cleanup_min_unavailable_days: 30
  local_repair_enabled: false
  openai_api_key: ""
  local_repair_paths:
    - configuration.yaml
    - automations.yaml
    - scripts.yaml
    - scenes.yaml
    - templates.yaml
    - packages
    - dashboards
    - www
schema:
  scan_interval_minutes: "int(1,1440)"
  max_problem_entities: "int(1,500)"
  max_log_lines: "int(100,10000)"
  redact_sensitive_data: bool
  github_token: password
  entity_cleanup_enabled: bool
  entity_cleanup_min_unavailable_days: "int(7,3650)"
  local_repair_enabled: bool
  openai_api_key: password
  local_repair_paths:
    - str
