configuration:
  scan_interval_minutes:
    name: Scan interval
    description: Minutes between automatic health scans.
  max_problem_entities:
    name: Maximum problem entities
    description: Maximum unavailable or unknown entities shown in the dashboard.
  max_log_lines:
    name: Maximum log entries
    description: Number of recent Home Assistant system-log entries to inspect.
  redact_sensitive_data:
    name: Redact sensitive data
    description: Hide values that look like credentials, addresses, or coordinates.
  github_token:
    name: GitHub workflow token
    description: Optional fine-grained token used only to dispatch the allowlisted Codex GitHub Actions workflow.
  entity_cleanup_enabled:
    name: Enable old and orphaned entity cleanup
    description: Shows confirmed and manual-review unavailable registry entries, and deletes only after manual selection and revalidation.
  entity_cleanup_min_unavailable_days:
    name: Persistent unavailable duration
    description: Minimum number of continuous unavailable days before an entity may appear as a manually approved cleanup candidate.
  local_repair_enabled:
    name: Enable OpenAI file repair
    description: Allows separately approved structured AI proposals and backup-protected local file changes.
  openai_api_key:
    name: OpenAI API key for file repair
    description: Masked API key used only to authenticate the structured OpenAI repair request.
  local_repair_paths:
    name: Locally repairable paths
    description: Relative files and directories inside the Home Assistant configuration whose filtered copies may be sent to the OpenAI repair model.
