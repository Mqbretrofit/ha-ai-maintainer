configuration:
  scan_interval_minutes:
    name: Vizsgálati időköz
    description: Az automatikus állapotvizsgálatok közötti idő percben.
  max_problem_entities:
    name: Megjelenített problémás entitások
    description: Legfeljebb ennyi unavailable vagy unknown entitás jelenjen meg.
  max_log_lines:
    name: Vizsgált naplóbejegyzések
    description: A Home Assistant rendszernaplójának legutóbbi ennyi bejegyzését vizsgálja.
  redact_sensitive_data:
    name: Érzékeny adatok kitakarása
    description: Elrejti a hitelesítő adatnak, címnek vagy koordinátának tűnő értékeket.
  github_token:
    name: GitHub workflow-token
    description: Opcionális, finomhangolt token, amely csak az engedélyezett Codex GitHub Actions workflow indítására szolgál.
  entity_cleanup_enabled:
    name: Régi és árva entitások törlésének engedélyezése
    description: Külön vizsgálattal, kézi kijelöléssel és újraellenőrzéssel engedélyezi a biztonsági feltételeknek megfelelő entitásregiszter-bejegyzések törlését.
  entity_cleanup_min_unavailable_days:
    name: Tartós unavailable időtartam
    description: Legalább ennyi napja folyamatosan unavailable entitás kerülhet a kézzel jóváhagyható törlési jelöltek közé.
  local_repair_enabled:
    name: Helyi Codex-javítás engedélyezése
    description: Külön jóváhagyással engedélyezi az izolált javaslatkészítést és a mentéssel védett helyi fájlmódosítást.
  openai_api_key:
    name: OpenAI API-kulcs a helyi Codexhez
    description: Maszkolt API-kulcs, amelyet kizárólag a helyben futó Codex CLI hitelesítésére használ.
  local_repair_paths:
    name: Helyileg javítható útvonalak
    description: A Home Assistant konfigurációs mappáján belüli relatív fájlok és könyvtárak, amelyek izolált másolatát a Codex megkaphatja.
