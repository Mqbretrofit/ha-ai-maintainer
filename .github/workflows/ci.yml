name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q ha_ai_maintainer/app tests
      - name: Validate Home Assistant YAML
        run: python tools/validate_yaml.py
      - name: Build Home Assistant app image
        run: >-
          docker build
          --build-arg BUILD_VERSION=0.5.2
          --build-arg BUILD_ARCH=amd64
          --tag ha-ai-maintainer:test
          ha_ai_maintainer
      - name: Verify container-compatible Codex sandbox
        run: >-
          docker run --rm
          --entrypoint codex
          ha-ai-maintainer:test
          --enable use_legacy_landlock
          sandbox landlock -- /bin/true
